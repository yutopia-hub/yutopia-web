spring.config.import=optional:classpath:application-test-local.properties
spring.datasource.url=${YUTOPIA_TEST_DB_URL:jdbc:mysql://localhost:3306/yutopia_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${YUTOPIA_TEST_DB_USERNAME:${YUTOPIA_DB_USERNAME:ssafy}}
spring.datasource.password=${YUTOPIA_TEST_DB_PASSWORD:${YUTOPIA_DB_PASSWORD:ssafy}}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
logging.level.com.yutopia=warn
logging.level.root=warn
logging.level.org.springframework=warn
spring.devtools.restart.enabled=false
debug=false
spring.main.banner-mode=off
