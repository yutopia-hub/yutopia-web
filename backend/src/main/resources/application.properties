spring.application.name=yutopia
# 개인 접속 정보는 application-local.properties (Git 제외) 에서 덮어쓴다.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties],optional:classpath:application-local.properties

server.port=${PORT:8080}

# ---- DataSource ----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${YUTOPIA_DB_URL:jdbc:mysql://localhost:3306/yutopia?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${YUTOPIA_DB_USERNAME:ssafy}
spring.datasource.password=${YUTOPIA_DB_PASSWORD:ssafy}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# ---- MyBatis ----
mybatis.type-aliases-package=com.yutopia.model.dto
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ---- YUTOPIA ----
# 프론트 개발 서버 / 배포 도메인 (콤마 구분)
yutopia.cors.allowed-origins=${YUTOPIA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://yutopia-web.vercel.app}
# 토큰 서명 키 — 운영에서는 반드시 환경변수로 32자 이상 지정
yutopia.auth.token-secret=${YUTOPIA_TOKEN_SECRET:local-dev-secret-change-me-please-32+}
yutopia.auth.token-ttl-hours=168
# 메일 발송이 없으므로 개발 중에는 재설정 토큰을 응답에 포함한다. 운영에서는 false.
yutopia.auth.expose-reset-token=${YUTOPIA_EXPOSE_RESET_TOKEN:true}

logging.pattern.console=%highlight(%d{HH:mm:ss} [%-5level]) %c{36}.%M:%L - %m%n
logging.level.com.yutopia=debug

# ---- Spring AI ----
# AI is opt-in: activate the ai profile to configure the chat model and client.
# Disable unused model auto-configurations so existing runs/tests need no API key.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# TMAP credentials stay on the backend; missing key only disables route requests.
yutopia.tmap.api-key=${TMAP_API_KEY:}
yutopia.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
