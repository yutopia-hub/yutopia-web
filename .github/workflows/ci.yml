name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_USER: ssafy
          MYSQL_PASSWORD: ssafy
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create yutopia_test schema
        run: |
          sed 's/\byutopia\b/yutopia_test/g' src/main/resources/db/schema.sql \
            | mysql -h 127.0.0.1 -uroot -pci --default-character-set=utf8mb4
          mysql -h 127.0.0.1 -uroot -pci -e "GRANT ALL ON yutopia_test.* TO 'ssafy'@'%'; FLUSH PRIVILEGES;"
      - run: chmod +x mvnw && ./mvnw -B test
        env:
          YUTOPIA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/yutopia_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
